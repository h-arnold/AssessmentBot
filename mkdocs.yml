site_name: AssessmentBot Documentation
site_description: A tool designed to simplify tracking and assessing the work of hundreds of students
site_author: h-arnold
repo_url: https://github.com/h-arnold/AssessmentBot
repo_name: h-arnold/AssessmentBot

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

exclude_docs: |
  developer/frontend/ant-design-docs-cache/*

nav:
  - Home: README.md
  - Setup:
      - Overview: setup/README.md
      - Configuration Options: setup/configOptions.md
      - Setting Up Assessment Records: setup/settingUpAssessmentRecords.md
  - How-Tos:
      - Overview: howTos/README.md
      - Rehydration: howTos/rehydration.md
  - Developer:
