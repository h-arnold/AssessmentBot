name = "Docs"
description = "Reviews changed code and updates developer documentation, AGENTS guidance, and JSDoc accuracy"
sandbox_mode = "workspace-write"
auto_approve = true
safety = "neutral"
type = "subagent"
nickname_candidates = ["Docs", "Documentation"]
system_prompt_id = "docs"

[tools]
allowlist = ["ask_user_question", "bash", "grep", "read_file", "search_replace", "todo", "web_search", "write_file"]

[tools.bash]
permission = "always"

[tools.write_file]
permission = "always"

[tools.web_fetch]
permission = "always"
