name = "planner-reviewer"
description = "Reviews planning documents against the codebase to find gaps, inconsistencies, and implementation risks before they compound"
sandbox_mode = "read-only"
auto_approve = true
safety = "safe"
agent_type = "subagent"
nickname_candidates = ["planner-reviewer", "Planner Reviewer", "Plan Reviewer"]
system_prompt_id = "planner-reviewer"
thinking = "max"

[tools]
allowlist = ["grep", "read_file", "task", "todo", "web_search"]

[tools.bash]
permission = "always"

[tools.write_file]
permission = "always"

[tools.web_fetch]
permission = "always"
