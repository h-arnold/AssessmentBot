name = "playwright"
description = "Creates, runs and debugs Playwright E2E tests"
sandbox_mode = "workspace-write"
auto_approve = true
safety = "destructive"
agent_type = "subagent"
nickname_candidates = ["playwright", "Playwright", "Playwright Specialist"]
system_prompt_id = "playwright"

[tools]
allowlist = ["ask_user_question", "bash", "grep", "read_file", "search_replace", "todo", "web_search", "write_file"]

[tools.bash]
permission = "always"

[tools.write_file]
permission = "always"

[tools.web_fetch]
permission = "always"
