active_model = "mistral-medium-3.5"
vim_keybindings = false
disable_welcome_banner_animation = false
autocopy_to_clipboard = true
file_watcher_for_autocomplete = false
displayed_workdir = ""
context_warnings = false
voice_mode_enabled = false
narrator_enabled = false
active_transcribe_model = "voxtral-realtime"
active_tts_model = "voxtral-tts"
auto_approve = false
enable_telemetry = true
system_prompt_id = "cli"
include_commit_signature = true
include_model_info = true
include_project_context = true
include_prompt_detail = true
enable_update_checks = true
enable_auto_update = true
enable_notifications = true
api_timeout = 720.0
auto_compact_threshold = 180000
tool_paths = []
mcp_servers = []
enabled_tools = []
disabled_tools = []
agent_paths = [
    "./.vibe/agents",
]
enabled_agents = [
    "*",
]
disabled_agents = []
installed_agents = []
skill_paths = []
enabled_skills = []
disabled_skills = []

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
browser_auth_base_url = "https://console.mistral.ai"
browser_auth_api_base_url = "https://console.mistral.ai/api"
api_style = "openai"
backend = "mistral"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[[providers]]
name = "codestral"
api_base = "https://codestral.mistral.ai/v1"
api_key_env_var = "CODESTRAL_API_KEY"
api_style = "openai"
backend = "mistral"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[[providers]]
name = "llamacpp"
api_base = "http://127.0.0.1:8080/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-medium-3.5"
temperature = 0.7
input_price = 1.5
output_price = 7.5
thinking = "high"
auto_compact_threshold = 180000

[[models]]
name = "mistral-small"
provider = "mistral"
alias = "mistral-small-latest"
temperature = 0.7
input_price = 0.15
output_price = 0.6
thinking = "off"
auto_compact_threshold = 180000

[[models]]
name = "codestral-latest"
provider = "codestral"
alias = "codestral-latest"
temperature = 0.2
input_price = 0.25
output_price = 1.0
thinking = "off"
auto_compact_threshold = 200000

[[models]]
name = "devstral-small-latest"
provider = "mistral"
alias = "devstral-small"
temperature = 0.2
input_price = 0.1
output_price = 0.3
thinking = "off"
auto_compact_threshold = 200000

[[models]]
name = "devstral"
provider = "llamacpp"
alias = "local"
temperature = 0.2
input_price = 0.0
output_price = 0.0
thinking = "off"
auto_compact_threshold = 200000

[[transcribe_providers]]
name = "mistral"
api_base = "wss://api.mistral.ai"
api_key_env_var = "MISTRAL_API_KEY"
client = "mistral"

[[transcribe_models]]
name = "voxtral-mini-transcribe-realtime-2602"
provider = "mistral"
alias = "voxtral-realtime"
sample_rate = 16000
encoding = "pcm_s16le"
language = "en"
target_streaming_delay_ms = 500

[[tts_providers]]
name = "mistral"
api_base = "https://api.mistral.ai"
api_key_env_var = "MISTRAL_API_KEY"
client = "mistral"

[[tts_models]]
name = "voxtral-mini-tts-latest"
provider = "mistral"
alias = "voxtral-tts"
voice = "gb_jane_neutral"
response_format = "wav"

[project_context]
default_commit_count = 5
timeout_seconds = 2.0

[session_logging]
save_dir = "./.vibe/logs/session"
session_prefix = "session"
enabled = true

[tools.todo]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []
max_todos = 100

[tools.exit_plan_mode]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.bash]
permission = "ask"
allowlist = [
    "basename",
    "cat",
    "cd",
    "echo",
    "file",
    "find",
    "git add",
    "git checkout",
    "git commit",
    "git diff",
    "git log",
    "git push",
    "git show",
    "git status",
    "grep",
    "head",
    "ls",
    "npm run lint",
    "npm test",
    "pwd",
    "python3",
    "sed",
    "stat",
    "tail",
    "task",
    "touch",
    "tree",
    "uname",
    "wc",
    "which",
    "whoami",
    "xargs",
]
denylist = [
    "gdb",
    "pdb",
    "passwd",
    "nano",
    "vim",
    "vi",
    "emacs",
    "bash -i",
    "sh -i",
    "zsh -i",
    "fish -i",
    "dash -i",
    "screen",
    "tmux",
]
sensitive_patterns = [
    "sudo",
]
max_output_bytes = 16000
default_timeout = 300
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]

[tools.task]
permission = "always"
allowlist = [
    "*",
]
denylist = []
sensitive_patterns = []

[tools.ask_user_question]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.web_fetch]
permission = "ask"
allowlist = [
    "docs.mistral.ai",
]
denylist = []
sensitive_patterns = []
default_timeout = 30
max_timeout = 120
max_content_bytes = 120000
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

[tools.write_file]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
max_write_bytes = 64000
create_parent_dirs = true

[tools.search_replace]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
max_content_size = 100000
create_backup = false
fuzzy_threshold = 0.9

[tools.skill]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.read_file]
permission = "always"
allowlist = [
    "./.vibe/agents/*",
]
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
max_read_bytes = 64000

[tools.web_search]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []
timeout = 120
model = "mistral-vibe-cli-with-tools"

[tools.grep]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
max_output_bytes = 64000
default_max_matches = 100
default_timeout = 60
exclude_patterns = [
    ".venv/",
    "venv/",
    ".env/",
    "env/",
    "node_modules/",
    ".git/",
    "__pycache__/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".tox/",
    ".nox/",
    ".coverage/",
    "htmlcov/",
    "dist/",
    "build/",
    ".idea/",
    ".vscode/",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    ".DS_Store",
    "Thumbs.db",
]
codeignore_file = ".vibeignore"
