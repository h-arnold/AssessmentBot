name: Component Quality CI

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'scripts/builder/**'
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/frontend/package.json'
      - 'src/frontend/package-lock.json'
      - 'vitest.config.js'
      - 'scripts/builder/vitest.config.ts'
      - 'src/frontend/vite.config.ts'
      - 'tsconfig.base.json'
      - 'config/eslint/ts-base-rules.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix src/frontend ci

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Run frontend coverage gate
        run: npm run test:frontend:coverage

  frontend-e2e:
    name: Frontend E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix src/frontend ci

      - name: Install Playwright browsers
        run: |
          # Kill any processes holding apt/dpkg locks (common cause of hangs on GHA runners)
          sudo killall apt-get apt aptd dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
          sudo dpkg --configure -a
          # Install Playwright Chromium with system dependencies
          cd src/frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:frontend:e2e

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci
# We don't check for backend coverage because there are aspects of the code that are very difficult to sensibly test outside of a GAS environment
      - name: Run backend tests
        run: npm run test:backend

  builder-checks:
    name: Builder checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix src/frontend ci
      - name: Run builder lint
        run: npm run lint:builder:check
      - name: Run builder tests
        run: npm run test:builder:coverage
      - name: Run builder build
        run: npm run build:production

      - name: Upload GAS build artefact
        uses: actions/upload-artifact@v4
        with:
          name: gas-build
          path: build/gas/
          if-no-files-found: error
